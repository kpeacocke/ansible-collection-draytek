---
- name: Inspect the documented time-server read command without changing configuration
  hosts: HomeOne
  gather_facts: false
  vars_files:
    - vars/live_validation.yml
  pre_tasks:
    - name: Prepare verified live validation
      ansible.builtin.import_tasks: tasks/prepare_live_validation.yml
  tasks:
    - name: Read current time-server settings privately
      kpeacocke.draytek.drayos_command:
        commands:
          - sys time show
          - sys time ?
      register: time_settings
      no_log: true

    - name: Report only time-server format diagnostics
      ansible.builtin.debug:
        msg:
          time_server_line_count: >-
            {{ time_settings.stdout[0] |
               regex_findall('(?m)^[ \t]*Time Server:[ \t]*\[[^\]\r\n]*\][ \t\r]*$') |
               length }}
          nonempty_server_line_count: >-
            {{ time_settings.stdout[0] |
               regex_findall('(?m)^[ \t]*Time Server:[ \t]*\[[^\]\r\n]+\][ \t\r]*$') |
               length }}
          server_label_count: >-
            {{ time_settings.stdout[0] | regex_findall('(?i)time[ ]*server') | length }}
          redacted_shape: >-
            {{ time_settings.stdout[0] | regex_replace('[^ :\n]', 'x') }}
          primary_ntp_label_count: >-
            {{ time_settings.stdout[0] | regex_findall('(?im)^[ \t]*Primary NTP Server:') | length }}
          secondary_ntp_label_count: >-
            {{ time_settings.stdout[0] | regex_findall('(?im)^[ \t]*Secondary NTP Server:') | length }}
          documented_subcommands: >-
            {{ time_settings.stdout[1] | regex_findall('(?i)sys time (?:server|show|inquire|wan|zone|pseudo)') | unique | list }}
          server_usage_shape: >-
            {{ time_settings.stdout[1] | regex_findall('(?im)sys time server[^\r\n]*') |
               map('regex_replace', '[^ <>/|\[\]()]', 'x') | list }}
          single_domain_usage: "{{ 'sys time server <domain>' in time_settings.stdout[1] | lower }}"

    - name: Require one recognised time-server line
      ansible.builtin.assert:
        that:
          - time_settings.stdout | length == 2
          - time_settings.stdout[0] | regex_findall('(?im)^[ \t]*Primary NTP Server:') | length == 1
          - time_settings.stdout[0] | regex_findall('(?im)^[ \t]*Secondary NTP Server:') | length == 1
      no_log: true
