---
- name: Capture the original hostname without logging device identifiers
  kpeacocke.draytek.drayos_hostname:
    state: gathered
  register: original_hostname
  no_log: true

- name: Require a distinct temporary name and populated original name
  ansible.builtin.assert:
    that:
      - original_hostname.gathered.hostname | length > 0
      - original_hostname.gathered.hostname != drayos_hostname_test_name
    fail_msg: Cannot safely establish a distinct original hostname for this test.
  no_log: true

- name: Prove the original name is supported and can be restored by this module
  kpeacocke.draytek.drayos_hostname:
    config:
      hostname: "{{ original_hostname.gathered.hostname }}"
  check_mode: true
  register: original_prediction
  no_log: true

- name: Require an unchanged original-state prediction before attempting writes
  ansible.builtin.assert:
    that:
      - not original_prediction.changed
      - original_prediction.commands == []
  no_log: true

- name: Qualify hostname changes and always attempt restoration
  block:
    - name: Predict a different hostname without writing
      kpeacocke.draytek.drayos_hostname:
        config:
          hostname: "{{ drayos_hostname_test_name }}"
      check_mode: true
      diff: true
      register: predicted_hostname
      no_log: true

    - name: Read hostname after the prediction
      kpeacocke.draytek.drayos_hostname:
        state: gathered
      register: after_prediction
      no_log: true

    - name: Prove changed prediction and zero check-mode mutation
      ansible.builtin.assert:
        that:
          - predicted_hostname.changed
          - predicted_hostname.before == original_hostname.gathered
          - predicted_hostname.after.hostname == drayos_hostname_test_name
          - predicted_hostname.commands == ['sys name ' ~ drayos_hostname_test_name]
          - predicted_hostname.diff.before == original_hostname.gathered
          - predicted_hostname.diff.after.hostname == drayos_hostname_test_name
          - after_prediction.gathered == original_hostname.gathered
      no_log: true

    - name: Apply and verify the approved temporary hostname
      kpeacocke.draytek.drayos_hostname:
        config:
          hostname: "{{ drayos_hostname_test_name }}"
      register: applied_hostname
      no_log: true

    - name: Repeat the same desired hostname
      kpeacocke.draytek.drayos_hostname:
        config:
          hostname: "{{ drayos_hostname_test_name }}"
      register: repeated_hostname
      no_log: true

    - name: Predict the already configured hostname
      kpeacocke.draytek.drayos_hostname:
        config:
          hostname: "{{ drayos_hostname_test_name }}"
      check_mode: true
      register: unchanged_prediction
      no_log: true

    - name: Prove write readback and repeat idempotency
      ansible.builtin.assert:
        that:
          - applied_hostname.changed
          - applied_hostname.after.hostname == drayos_hostname_test_name
          - not repeated_hostname.changed
          - repeated_hostname.commands == []
          - repeated_hostname.before == repeated_hostname.after
          - not unchanged_prediction.changed
          - unchanged_prediction.commands == []
      no_log: true

    - name: Allow the approved operator to restore the original name through HTTPS
      ansible.builtin.pause:
        seconds: 180
        prompt: Restore only the original router name using the approved HTTPS management route now.
      when: drayos_hostname_recovery_rehearsal | default(false) | bool

    - name: Read hostname after the independent recovery window
      kpeacocke.draytek.drayos_hostname:
        state: gathered
      register: independent_recovery
      no_log: true
      when: drayos_hostname_recovery_rehearsal | default(false) | bool

    - name: Prove the original hostname was restored independently of SSH writes
      ansible.builtin.assert:
        that:
          - independent_recovery.gathered == original_hostname.gathered
        fail_msg: Independent HTTPS restoration was not observed within the recovery window.
      no_log: true
      when: drayos_hostname_recovery_rehearsal | default(false) | bool
  always:
    - name: Restore and verify the captured original hostname
      kpeacocke.draytek.drayos_hostname:
        config:
          hostname: "{{ original_hostname.gathered.hostname }}"
      register: restored_hostname
      no_log: true

    - name: Independently reread the restored hostname
      kpeacocke.draytek.drayos_hostname:
        state: gathered
      register: final_hostname
      no_log: true

    - name: Require the final router name to match the original
      ansible.builtin.assert:
        that:
          - restored_hostname.after == original_hostname.gathered
          - final_hostname.gathered == original_hostname.gathered
      no_log: true

- name: Report only the bounded qualification outcome
  ansible.builtin.debug:
    msg: >-
      Hostname qualification passed via {{ drayos_hostname_validation_backend }}:
      check/diff, verified write, second-run idempotency, unchanged prediction,
      original name restored; independent HTTPS recovery={{
      drayos_hostname_recovery_rehearsal | default(false) | bool }}.
