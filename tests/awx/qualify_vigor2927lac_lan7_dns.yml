---
- name: Qualify or verify restoration of LAN7 DNS
  hosts: HomeOne
  gather_facts: false
  vars_files:
    - vars/live_validation.yml
  vars:
    ansible_persistent_log_messages: false
  pre_tasks:
    - name: Require explicit mode and private, bounded execution
      ansible.builtin.assert:
        that:
          - >-
            dns_lan7_mode | default('') in ['qualify_once', 'restore_once', 'verify_restored',
            'module_cycle', 'secondary_cycle', 'secondary_check', 'secondary_module_cycle']
          - dns_lan7_mode != 'qualify_once' or dns_lan7_write_approved | default(false) | bool
          - dns_lan7_mode != 'restore_once' or dns_lan7_restore_approved | default(false) | bool
          - dns_lan7_mode != 'module_cycle' or dns_lan7_module_cycle_approved | default(false) | bool
          - dns_lan7_mode != 'secondary_cycle' or dns_lan7_secondary_cycle_approved | default(false) | bool
          - dns_lan7_mode != 'secondary_module_cycle' or dns_lan7_secondary_module_cycle_approved | default(false) | bool
          - dns_lan7_mode not in ['secondary_cycle', 'secondary_module_cycle'] or dns_lan7_independent_recovery_ready | default(false) | bool
          - not ansible_check_mode
          - not ansible_persistent_log_messages | bool
          - ansible_play_hosts_all == ['HomeOne']
    - name: Prepare verified live validation
      ansible.builtin.import_tasks: tasks/prepare_live_validation.yml
  tasks:
    - name: Read and verify exact router platform privately
      kpeacocke.draytek.drayos_command:
        commands:
          - sys version
        retries: 1
      register: dns_platform
      no_log: true

    - name: Require the qualified hardware model and firmware
      ansible.builtin.assert:
        that:
          - dns_platform.stdout[0] is search('(?m)^[ \t]*Router Model:[ \t]*Vigor2927Lac[ \t]+Version:[ \t]*4\.5\.2\.2(?:[ \t\r]|$)')

    - name: Gather DNS baseline privately
      kpeacocke.draytek.drayos_dns:
      register: dns_baseline
      no_log: true

    - name: Require the expected LAN7 baseline for the requested operation
      ansible.builtin.assert:
        that:
          - dns_baseline.gathered.LAN7.secondary is none
          - dns_lan7_mode == 'restore_once' or dns_baseline.gathered.LAN7.primary is none
          - dns_lan7_mode != 'restore_once' or dns_baseline.gathered.LAN7.primary in [none, '192.0.2.53']

    - name: Execute only the approved LAN7 primary DNS mutation
      when: dns_lan7_mode == 'qualify_once' or (dns_lan7_mode == 'restore_once' and dns_baseline.gathered.LAN7.primary is not none)
      block:
        - name: Read LAN settings privately before the write
          kpeacocke.draytek.drayos_command:
            commands:
              - command: show lan
                prompt: "{{ [pager_prompt] * 64 }}"
                answer: "{{ [' '] * 64 }}"
                newline: false
                check_all: true
            retries: 1
          vars:
            pager_prompt: >-
              --- MORE ---[ \t]+\['q': Quit, 'Enter': New Lines, 'Space Bar': Next Page\] ---[ \t\r\n]*$
          register: dns_lan_status
          no_log: true

        - name: Require LAN7 to be disabled
          ansible.builtin.assert:
            that:
              - dns_lan_status.stdout[0] | regex_findall('(?m)^[ \t%]*\[[VX]\][ \t]*LAN7(?=[ \t])') | length == 1
              - dns_lan_status.stdout[0] is search('(?m)^[ \t%]*\[X\][ \t]*LAN7(?=[ \t])')
            fail_msg: LAN7 is not demonstrably disabled; no setter will run.

        - name: Set only the temporary LAN7 primary resolver
          when: dns_lan7_mode == 'qualify_once'
          kpeacocke.draytek.drayos_command:
            commands:
              - srv dhcp dns1 lan7 192.0.2.53
            retries: 1
          changed_when: true
          no_log: true

        - name: Attempt to restore only the LAN7 primary resolver
          when: dns_lan7_mode == 'restore_once'
          kpeacocke.draytek.drayos_command:
            commands:
              - srv dhcp dns1 lan7 0.0.0.0
            retries: 1
          changed_when: true
          no_log: true

        - name: Gather all LAN DNS fields after the change privately
          kpeacocke.draytek.drayos_dns:
          register: dns_after
          no_log: true

        - name: Verify the exact change and unchanged other LAN DNS fields
          ansible.builtin.assert:
            that:
              - >-
                dns_after.gathered == dns_baseline.gathered |
                combine({'LAN7': {'primary': '192.0.2.53' if dns_lan7_mode == 'qualify_once' else none}}, recursive=true)
            fail_msg: Unexpected DNS readback; use the independently approved HTTPS recovery.
          no_log: true

    - name: Qualify the public module with automatic restoration
      when: dns_lan7_mode == 'module_cycle'
      block:
        - name: Set the approved temporary primary resolver with the public module
          kpeacocke.draytek.drayos_dns:
            state: merged
            lan: LAN7
            primary_server: "192.0.2.53"
          register: dns_module_set
          no_log: true

        - name: Repeat the same desired primary resolver
          kpeacocke.draytek.drayos_dns:
            state: merged
            lan: LAN7
            primary_server: "192.0.2.53"
          register: dns_module_repeat
          no_log: true

        - name: Verify the module changed only on the first invocation
          ansible.builtin.assert:
            that:
              - dns_module_set.changed
              - dns_module_set.before is none
              - dns_module_set.after == '192.0.2.53'
              - not dns_module_repeat.changed
              - dns_module_repeat.after == '192.0.2.53'
          no_log: true
      always:
        - name: Read current DNS before attempting cleanup
          kpeacocke.draytek.drayos_dns:
          register: dns_cleanup_before
          no_log: true

        - name: Refuse to overwrite an unexpected primary DNS value
          ansible.builtin.assert:
            that:
              - dns_cleanup_before.gathered.LAN7.primary in [none, '192.0.2.53']
            fail_msg: LAN7 primary DNS is neither unset nor the temporary value; inspect independently.

        - name: Clear the primary resolver with the public module
          kpeacocke.draytek.drayos_dns:
            state: merged
            lan: LAN7
            primary_server: "0.0.0.0"
          register: dns_module_clear
          no_log: true

        - name: Read the full DNS baseline again
          kpeacocke.draytek.drayos_dns:
          register: dns_cleanup_after
          no_log: true

        - name: Verify the entire baseline and expected clear status
          ansible.builtin.assert:
            that:
              - dns_cleanup_after.gathered == dns_baseline.gathered
              - dns_module_clear.changed == (dns_cleanup_before.gathered.LAN7.primary is not none)
          no_log: true

    - name: Require that the module performed the restoration
      when: dns_lan7_mode == 'module_cycle'
      ansible.builtin.assert:
        that:
          - dns_module_clear.changed
          - dns_module_clear.before == '192.0.2.53'
          - dns_module_clear.after is none
      no_log: true

    - name: Verify secondary DNS module predictions without a write
      when: dns_lan7_mode == 'secondary_check'
      block:
        - name: Predict a secondary resolver change
          kpeacocke.draytek.drayos_dns:
            state: merged
            lan: LAN7
            secondary_server: "192.0.2.54"
          check_mode: true
          diff: true
          register: dns_secondary_prediction
          no_log: true

        - name: Predict no change when clearing the unset secondary resolver
          kpeacocke.draytek.drayos_dns:
            state: merged
            lan: LAN7
            secondary_server: "0.0.0.0"
          check_mode: true
          register: dns_secondary_no_change
          no_log: true

        - name: Gather DNS after the check-mode predictions
          kpeacocke.draytek.drayos_dns:
          register: dns_secondary_after_predictions
          no_log: true

        - name: Verify both predictions and unchanged DNS readback
          ansible.builtin.assert:
            that:
              - dns_secondary_prediction.changed
              - dns_secondary_prediction.before is none
              - dns_secondary_prediction.after == '192.0.2.54'
              - dns_secondary_prediction.diff.before.secondary_server is none
              - dns_secondary_prediction.diff.after.secondary_server == '192.0.2.54'
              - not dns_secondary_no_change.changed
              - dns_secondary_no_change.after is none
              - dns_secondary_after_predictions.gathered == dns_baseline.gathered
          no_log: true

    - name: Qualify secondary DNS only with explicit approval and recovery standby
      when: dns_lan7_mode in ['secondary_cycle', 'secondary_module_cycle']
      block:
        - name: Read LAN settings privately before the secondary DNS write
          kpeacocke.draytek.drayos_command:
            commands:
              - command: show lan
                prompt: "{{ [pager_prompt] * 64 }}"
                answer: "{{ [' '] * 64 }}"
                newline: false
                check_all: true
            retries: 1
          vars:
            pager_prompt: >-
              --- MORE ---[ \t]+\['q': Quit, 'Enter': New Lines, 'Space Bar': Next Page\] ---[ \t\r\n]*$
          register: dns_secondary_lan_status
          no_log: true

        - name: Require an unambiguously disabled LAN7 for secondary DNS
          ansible.builtin.assert:
            that:
              - dns_secondary_lan_status.stdout[0] | regex_findall('(?m)^[ \t%]*\[[VX]\][ \t]*LAN7(?=[ \t])') | length == 1
              - dns_secondary_lan_status.stdout[0] is search('(?m)^[ \t%]*\[X\][ \t]*LAN7(?=[ \t])')
            fail_msg: LAN7 is not demonstrably disabled; no setter will run.

        - name: Recheck the DNS baseline immediately before the write
          kpeacocke.draytek.drayos_dns:
          register: dns_secondary_prewrite
          no_log: true

        - name: Refuse to write if the DNS baseline changed
          ansible.builtin.assert:
            that:
              - dns_secondary_prewrite.gathered == dns_baseline.gathered
            fail_msg: DNS baseline changed; no secondary DNS setter will run.
          no_log: true

        - name: Test the documented secondary DNS command with automatic cleanup
          block:
            - name: Set only the temporary LAN7 secondary resolver
              when: dns_lan7_mode == 'secondary_cycle'
              kpeacocke.draytek.drayos_command:
                commands:
                  - srv dhcp dns2 lan7 192.0.2.54
                retries: 1
              changed_when: true
              no_log: true

            - name: Set the temporary secondary resolver with the public module
              when: dns_lan7_mode == 'secondary_module_cycle'
              kpeacocke.draytek.drayos_dns:
                state: merged
                lan: LAN7
                secondary_server: "192.0.2.54"
              register: dns_secondary_module_set
              no_log: true

            - name: Gather DNS fields after the secondary DNS write
              kpeacocke.draytek.drayos_dns:
              register: dns_secondary_after
              no_log: true

            - name: Verify the secondary resolver and all other DNS fields
              ansible.builtin.assert:
                that:
                  - >-
                    dns_secondary_after.gathered == dns_baseline.gathered |
                    combine({'LAN7': {'secondary': '192.0.2.54'}}, recursive=true)
                fail_msg: Unexpected DNS readback; use the independently approved HTTPS recovery.
              no_log: true

            - name: Repeat the same desired secondary resolver
              when: dns_lan7_mode == 'secondary_module_cycle'
              kpeacocke.draytek.drayos_dns:
                state: merged
                lan: LAN7
                secondary_server: "192.0.2.54"
              register: dns_secondary_module_repeat
              no_log: true

            - name: Verify the module changed only on the first invocation
              when: dns_lan7_mode == 'secondary_module_cycle'
              ansible.builtin.assert:
                that:
                  - dns_secondary_module_set.changed
                  - dns_secondary_module_set.before is none
                  - dns_secondary_module_set.after == '192.0.2.54'
                  - not dns_secondary_module_repeat.changed
                  - dns_secondary_module_repeat.after == '192.0.2.54'
              no_log: true
          always:
            - name: Read current DNS before attempting secondary cleanup
              kpeacocke.draytek.drayos_dns:
              register: dns_secondary_cleanup_before
              no_log: true

            - name: Refuse to overwrite an unexpected secondary DNS value
              ansible.builtin.assert:
                that:
                  - dns_secondary_cleanup_before.gathered.LAN7.secondary in [none, '192.0.2.54']
                fail_msg: LAN7 secondary DNS is neither unset nor the temporary value; inspect independently.

            - name: Attempt to restore the unset LAN7 secondary resolver
              when: dns_lan7_mode == 'secondary_cycle' and dns_secondary_cleanup_before.gathered.LAN7.secondary is not none
              kpeacocke.draytek.drayos_command:
                commands:
                  - srv dhcp dns2 lan7 0.0.0.0
                retries: 1
              changed_when: true
              no_log: true

            - name: Restore secondary DNS with module and qualified CLI fallback
              when: dns_lan7_mode == 'secondary_module_cycle' and dns_secondary_cleanup_before.gathered.LAN7.secondary is not none
              block:
                - name: Clear the secondary resolver with the public module
                  kpeacocke.draytek.drayos_dns:
                    state: merged
                    lan: LAN7
                    secondary_server: "0.0.0.0"
                  register: dns_secondary_module_clear
                  no_log: true
              rescue:
                - name: Re-read DNS after the module cleanup failure
                  kpeacocke.draytek.drayos_dns:
                  register: dns_secondary_fallback_before
                  no_log: true

                - name: Refuse fallback for an unexpected secondary value
                  ansible.builtin.assert:
                    that:
                      - dns_secondary_fallback_before.gathered.LAN7.secondary in [none, '192.0.2.54']
                    fail_msg: LAN7 secondary DNS is unexpected; inspect independently.

                - name: Restore the unset secondary resolver with the qualified CLI
                  when: dns_secondary_fallback_before.gathered.LAN7.secondary is not none
                  kpeacocke.draytek.drayos_command:
                    commands:
                      - srv dhcp dns2 lan7 0.0.0.0
                    retries: 1
                  changed_when: true
                  no_log: true

                - name: Read all DNS fields after the fallback
                  kpeacocke.draytek.drayos_dns:
                  register: dns_secondary_fallback_after
                  no_log: true

                - name: Verify the full baseline after the fallback
                  ansible.builtin.assert:
                    that:
                      - dns_secondary_fallback_after.gathered == dns_baseline.gathered
                    fail_msg: DNS baseline not restored; use the independently approved HTTPS recovery.
                  no_log: true

                - name: Report the module cleanup failure despite fallback
                  ansible.builtin.fail:
                    msg: Module cleanup failed; CLI fallback restored the DNS baseline. Verify independently before retrying.

            - name: Read all DNS fields after secondary cleanup
              kpeacocke.draytek.drayos_dns:
              register: dns_secondary_cleanup_after
              no_log: true

            - name: Require restoration of the entire DNS baseline
              ansible.builtin.assert:
                that:
                  - dns_secondary_cleanup_after.gathered == dns_baseline.gathered
                fail_msg: DNS baseline not restored; use the independently approved HTTPS recovery.
              no_log: true

    - name: Require that the module performed secondary DNS restoration
      when: dns_lan7_mode == 'secondary_module_cycle'
      ansible.builtin.assert:
        that:
          - dns_secondary_module_clear.changed
          - dns_secondary_module_clear.before == '192.0.2.54'
          - dns_secondary_module_clear.after is none
      no_log: true

    - name: Report the approved next step
      ansible.builtin.debug:
        msg: >-
          {{ 'Temporary LAN7 primary DNS verified; restoration is required.'
             if dns_lan7_mode == 'qualify_once'
             else 'Both LAN7 DNS fields verified as unset.' }}
