---
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: kpeacocke.draytek.drayos
ansible_command_timeout: 60
ansible_connect_timeout: 30
ansible_host_key_checking: true
ansible_ssh_host_key_checking: true
ansible_libssh_host_key_checking: true
ansible_paramiko_host_key_checking: true
ansible_libssh_host_key_auto_add: false
ansible_paramiko_host_key_auto_add: false
ansible_network_cli_host_key_auto_add: false
ansible_network_single_user_mode: false
validation_host_key_name: >-
  {{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname)
     if hostvars[inventory_hostname].ansible_port | default(22) | int == 22
     else '[' ~ (hostvars[inventory_hostname].ansible_host | default(inventory_hostname))
          ~ ']:' ~ (hostvars[inventory_hostname].ansible_port | string) }}
