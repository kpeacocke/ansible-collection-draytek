---
- name: Install transport dependency inside the temporary validation project
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install declared collection dependencies into the portable layout
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -m
          - ansible.cli.galaxy
          - collection
          - install
          - -r
          - "{{ playbook_dir }}/../../requirements.yml"
          - -p
          - "{{ playbook_dir }}/collections"
      changed_when: true

- name: Validate read-only facts on the known Lac router
  hosts: HomeOne
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: kpeacocke.draytek.drayos
    ansible_command_timeout: 60
    ansible_connect_timeout: 30
  tasks:
    - name: Probe interface pager without advancing it
      drayos_pager_probe:
        command: sys iface
      vars:
        ansible_terminal_stdout_re:
          - pattern: '[\r\n]?[\w\-.:/\[\]]+[>#] ?$'
          - pattern: '--- MORE ---[^\r\n]*'
      register: pager_probe
      no_log: true
    - name: Report pager formatting only
      ansible.builtin.debug:
        var: pager_probe
    - name: Close probe session
      ansible.builtin.meta: reset_connection
