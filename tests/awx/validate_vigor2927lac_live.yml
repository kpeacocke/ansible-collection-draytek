---
- name: Install transport dependency inside the temporary validation project
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    validation_host_key_name: >-
      {{ hostvars['HomeOne'].ansible_host | default('HomeOne')
         if hostvars['HomeOne'].ansible_port | default(22) | int == 22
         else '[' ~ (hostvars['HomeOne'].ansible_host | default('HomeOne'))
              ~ ']:' ~ (hostvars['HomeOne'].ansible_port | string) }}
  tasks:
    - name: Require a previously verified SSH host key
      ansible.builtin.assert:
        that:
          - drayos_validation_known_host is defined
          - drayos_validation_known_host is string
          - drayos_validation_known_host | trim | length > 0
          - drayos_validation_known_host.split() | length >= 3
          - drayos_validation_known_host.split()[0] == validation_host_key_name
        fail_msg: Supply drayos_validation_known_host from a previously verified known_hosts entry.
      no_log: true

    - name: Create the execution environment SSH directory
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
        state: directory
        mode: "0700"

    - name: Trust only the supplied router SSH host key
      ansible.builtin.known_hosts:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ validation_host_key_name }}"
        key: "{{ drayos_validation_known_host }}"
        hash_host: true
      no_log: true

    - name: Install declared collection dependencies into the portable layout
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -m
          - ansible.cli.galaxy
          - collection
          - install
          - -r
          - "{{ playbook_dir }}/../../requirements.yml"
          - -p
          - "{{ playbook_dir }}/collections"
      changed_when: true

    - name: Require fail-closed SSH host key policies before device access
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.config', 'CONFIG_FILE') ==
            (playbook_dir ~ '/../../ansible.cfg') | realpath
          - lookup('ansible.builtin.env', 'ANSIBLE_HOST_KEY_AUTO_ADD') | lower
            in ['', 'false', 'no', 'off', '0', 'n']
          - lookup('ansible.builtin.env', 'ANSIBLE_LIBSSH_HOST_KEY_AUTO_ADD') | lower
            in ['', 'false', 'no', 'off', '0', 'n']
        fail_msg: Load the project ansible.cfg and disable SSH host key auto-add overrides.

- name: Validate read-only facts on the known Lac router
  hosts: HomeOne
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: kpeacocke.draytek.drayos
    ansible_command_timeout: 60
    ansible_connect_timeout: 30
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
  tasks:
    - name: Load live validation using the project-synced collection
      ansible.builtin.include_tasks: tasks/validate_lac_facts.yml
