---
- name: Validate read-only facts on the known Lac router
  hosts: HomeOne
  gather_facts: false
  vars_files:
    - vars/live_validation.yml
  pre_tasks:
    - name: Prepare verified live validation
      ansible.builtin.import_tasks: tasks/prepare_live_validation.yml
  tasks:
    - name: Load live validation using the project-synced collection
      ansible.builtin.include_tasks: tasks/validate_lac_facts.yml
