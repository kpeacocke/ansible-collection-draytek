    VLAN configuration. <1-2147483647> - Specify a group ID to map. <1-4094> - Specify a VLAN ID. Related Syntax:'
  - <config-if># vlan mac-vlan group <1-2147483647> vlan <1-4094>
  - '<config-if># vlan protocol-vlan group<1-2147483647> vlan <1-4094> voice-vlan cos - Set voice VLAN configuration as COS
    mode. mode - Set voice member port join mode. <all> - QoS attributes are applied on all packets that are classified to
    the Voice VLAN. <src> - QoS attributes are applied only on packets from IP phones. <auto> - Make voice member port join
    voice VLAN automatically. <manual> - The administrator manually makes voice member port join voice VLAN. Related Syntax:'
  - <config-if># voice-vlan cos <all/src>
  - <config-if># voice-vlan mode <auto/manual>
  examples:
