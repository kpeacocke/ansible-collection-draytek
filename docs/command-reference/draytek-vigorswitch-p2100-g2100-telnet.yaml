    - Enter the MAC address to be mapped. <9-48> - Enter a number representing the subnet mask. Related Syntax:'
  - '<config># vlan mac-vlan group <1-2147483647> <A:B:C:D:E:F> mask <9-48> vlan protocol-vlan group Create a protocol VLAN
    group with specified protocol type and value. <1-8> - Enter a number to specify a VLAN group. <Ethernet_ii/ 11c_other/snap_1042>
    - Specify a frame type by entering Ethernet_ii, 11c_other or snap_1042. <value> - Enter a value (0x0600~0xFFFE). Related
