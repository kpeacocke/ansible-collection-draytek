  source_reference: "Telnet Command: aaa\nUse this command to add a login authentication list to authenticate with local,\
    \ tacacs+,\nradius, and none service.\nSyntax Items\naaa authentication enable\naaa authentication login\nDescription\n\
    Syntax Items\nDescription\naaa authentication enable\nEnable authentication is used only on CLI for a user trying to switch\n\
    from User EXEC (>) mode to Privileged EXEC (#) mode.\nenable – Enable the authentication list.\n<LISTNAME> – Enter a string\
    \ as the list name for authentication\ntype. Default value is “default”.\n<none, enable, tacacs+, radius> – Specify the\
    \ authentication\nmethod by entering none, enable, tacacs+ or radius.\n•\nNone: Do nothing and just make user be authenticated.\n\
    •\nEnable: Use local password to authenticate.\n•\nTacacs+: Use remote Tacas+ server to authenticate.\n•\nRadius: Use\
    \ remote Radius server to authenticate.\ndefault - It is used to configure default enable authentication.\nRelated Syntax:\n\
    •\n<config>#aaa authentication enable <LISTNAME> <none,\nenable, tacacs+, radius>\n•\n<config>#aaa authentication enable\
    \ default <none, enable,\ntacacs+, radius>\naaa authentication login\nLogin authentication is used when a user tries to\
    \ login into the\nswitch.\n<LISTNAME> – Enter a string as the list name for authentication\ntype. Default value is “default”.\n\
    \n<none, enable, tacacs+, radius> –Specify the authentication method\nby entering none, enable, tacacs+ or radius.\ndefault\
    \ - It is used to configure default login authentication.\nRelated Syntax:\n•\n<config>#aaa authentication login <LISTNAME>\
    \ <none,\nenable, tacacs+, radius>\n•\n<config>#aaa authentication login default <none, enable,\ntacacs+, radius>\nExample\n\
    P2100# configure\nP2100(config)#\nP2100(config)# aaa authentication enable LISTNAME enable\nP2100(config)#\nP2100(config)#\
    \ exit\nP2100# show aaa authentication enable lists\n Enable List Name   Authentication Method List\n------------------\
    \ -------------------------------\n          default    enable\n         LISTNAME\nenable\nP2100#"
