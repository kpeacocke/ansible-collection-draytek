  source_reference: "Telnet Command: authentication\nUse this command to enable the global setting of 802.1x/MAC/WEB authentication\
    \ network\naccess control (default is disabled for all).\nSyntax Items\nauthentication dot1x\nauthentication guest-vlan\n\
    authentication mac\nauthentication web\n\nDescription\nSyntax Items\nDescription\nauthentication dot1x\nEnable 802.1x\
    \ authentication by entering the word, dot1x after\nauthentication.\nRelated Syntax:\n•\n<config># authentication dot1x\n\
    authentication guest-vlan\nConfigure the guest VLAN.\n<1-4094> - Specify a guest VLAN ID by entering its number.\nRelated\
    \ Syntax:\n•\n<config># authentication guest-vlan <1-4094>\nauthentication mac\nEnable MAC authentication by entering\
    \ the word, mac after\nauthentication.\nmac local - Local database for MAC-Based authentication. It can add\nlocal MAC\
    \ authentication hosts in database.\n<A:B:C:D:E:F> - Enter the MAC address to be added for\nauthentication.\ncontrol auth\
    \ – Set a local entry control mode, auth (the host will be\nset to authorized) or unauth (the host will be set to unauthorized).\n\
    vlan <1~4094> - Specify a VLAN ID by entering its number\nreauth-period <300~4294967294> - Set a time to initiate automatic\n\
    re-authentication.\ninactive-timeout <60~65535>- Set the inactive timeout for MAC\nauthentication host. After the time\
    \ interval, if there is no activity\nfrom the client, then it will be unauthorized by Vigor system.\ncontrol unauth -\
    \ Set a local entry control mode as “unauth” to let\nthe host set as unauthorized.\nradius mac-case <lower / upper> -\
    \ Set RADIUS user ID with lower\ncase or upper case.\nradius mac-delimiter <colon/dot/hyphen/none> - Select RADIUS\nuser\
    \ ID delimiter. In which,\ncolon: XX:XX:XX:XX:XX:XX\ndot: XX.XX.XX.XX.XX.XX\nhyphen: XX-XX-XX-XX-XX-XX\nnone: XXXXXXXXXXXX\n\
    gap <2/4/6> - Select delimiter gap.\nRelated Syntax:\n•\n<config>#authentication mac\n•\n<config>#authentication mac local\
    \ <A:B:C:D:E:F> control\nauth inactive-timeout <60~65535>\n•\n<config>#authentication mac local <A:B:C:D:E:F> control\n\
    auth reauth-period <300~4294967294>\n•\n<config>#authentication mac local <A:B:C:D:E:F> control\nauth vlan <1~4094>\n\
    •\n<config>#authentication mac local <A:B:C:D:E:F> control\nauth vlan<1~4094> reauth-period <300~4294967294>\n•\n<config>#authentication\
    \ mac local <A:B:C:D:E:F> control\nauth vlan<1~4094> reauth-period <300~4294967294>\ninactive-timeout <60~65535>\n•\n\
    <config>#authentication mac local <A:B:C:D:E:F> control\nunauth\n•\n<config>#authentication mac radius mac-case <lower\
    \ /\nupper>\n•\n<config>#authentication mac radius mac-delimiter\n<colon/dot/hyphen/none>\n\n•\n<config>#authentication\
    \ mac radius mac-delimiter\n<colon/dot/hyphen/none> gap <2/4/6>\nauthentication web\nWeb - Enable web authentication by\
    \ entering the word “web” after\n“authentication”.\nusername <WORD> - Specify a username.\npassword <string> - Set a password.\n\
    vlan <1~4094> - Specify a VLAN ID by entering its number.\nreauth-period <30~4294967294> - Set a time to initiate automatic\n\
    re-authentication.\ninactive-timeout <60~65535>- Set the inactive timeout for MAC\nauthentication host. After the time\
    \ interval, if there is no activity\nfrom the client, then it will be unauthorized by Vigor system.\nRelated Syntax:\n\
    •\n<config>#authentication web\n•\n<config>#authentication web local username <WORD>\npassword <string> inactive-timeout\
    \ <60~65535>\n•\n<config>#authentication web local username <WORD>\npassword <string> reauth-period <300~4294967294>\n\
    •\n<config>#authentication web local username <WORD>\npassword <string> reauth-period <300~4294967294>\ninactive-timeout\
    \ <60~65535>\n•\n<config>#authentication web local username <WORD>\npassword <string> vlan<1~4094>\n•\n<config>#authentication\
    \ web local username <WORD>\npassword <string> vlan<1~4094> reauth-period\n<30~4294967294> inactive-timeout <60~65535>\n\
    Example\nP2100# configure\nP2100(config)# authentication dot1x\nP2100(config)# vlan 3\nP2100(config-vlan)# exit\nP2100(config)#\
    \ authentication guest-vlan 3\nP2100(config)#\nP2100(config)# exit\nP2100# show authentication\nAutentication dot1x state\
    \      : enabled\nAutentication mac state\n: disabled\nAutentication web state\n: disabled\nGuest VLAN               \
    \      : enabled (3)\nMac-auth Radius User ID Format : XXXXXXXXXXXX\nMac-auth Local Entry\n:\nWeb-auth Local Entry\n:\n\
    Interface Configurations\nInterface GigabitEthernet1\n  Admin Control\n: disable\n  Host Mode\n: multi-auth\n  Type dot1x\
    \ State\n: disabled\n  Type mac State\n: disabled\n  Type web State\n: disabled\n  Type Order\n: dot1x\n  MAC/WEB Method\
    \ Order\n: radius\n  Guest VLAN\n: disabled\n  Reauthentication\n: disabled\n  Max Hosts\n: 256\n  VLAN Assign Mode\n\
    : static\n\n--More—\n………………………………………………………………………………………………..\nP2100# configure\nP2100(config)# authentication mac local\
    \ 00:11:22:33:00:01 control auth vlan\n3 reauth-period 500 inactive-timeout 300\nP2100(config)#\nP2100(config)# authentication\
    \ mac local 00:11:22:33:00:01 control unauth\nP2100(config)#\nP2100(config)# authentication web local username user_1\
    \ password 1234tw vlan\n3 reauth-period 600 inactive-timeout 700\nP2100(config)#"
