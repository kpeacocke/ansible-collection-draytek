  source_reference: 'Telnet Command: interface

    Use this command to configure interface settings.

    Before configuring, you have to access into next phase. See the following example:

    P2100# configure

    P2100(config)#

    P2100(config)# interface GigabitEthernet 3

    P2100(config-if)#

    Or

    P2100# configure

    P2100(config)#


    P2100(config)# interface range LAG 3

    P2100(config-if-range)#

    Syntax Items

    interface GigabitEthernet

    interface vlan

    interface LAG

    interface range

    Description

    Syntax Items

    Description

    interface GigabitEthernet

    <1-10> - Specify the number of Ethernet LAN port.

    Related Syntax:

    •

    <config># interface GigabitEthernet <1-10>

    Interface vlan

    <1-4094> - Specify the number of VLAN ID.

    Related Syntax:

    •

    <config># interface vlan <1-4094>

    interface LAG

    <1-8> - Specify the number of LAG interface.

    Related Syntax:

    •

    <config># interface LAG <1-8>

    Interface range

    Specify an interface ranges for configuring detailed settings.

    Related Syntax:

    •

    <config># interface range GigabitEthernet <1-10>

    •

    <config># interface range LAG <1-8>

    Example

    P2100# configure

    P2100(config)# interface LAG 1

    P2100(config-if)#


    Under (config-if)#, available sub-commands for LAN or LAG will be different. Below

    shows the items under Ethernet LAN:

    <config-if># authentication

    <config-if># back-pressure

    <config-if># custom

    <config-if># description

    <config-if># device-check

    <config-if># dos

    <config-if># dot1x

    <config-if># do

    <config-if># dray_surveillence

    <config-if># duplex

    <config-if># eee

    <config-if># end

    <config-if># exit

    <config-if># flowcontrol

    <config-if># gvrp

    <config-if># ip

    <config-if># ipv6

    <config-if># lacp

    <config-if># lag

    <config-if># lldp


    <config-if># loop-protection

    <config-if># mac

    <config-if># mvr

    <config-if># no

    <config-if># poe

    <config-if># port-security

    <config-if># power

    <config-if># protected

    <config-if># qos

    <config-if># rate-limit

    <config-if># shutdown

    <config-if># spanning-tree

    <config-if># speed

    <config-if># storm-control

    <config-if># surveillance-vlan

    <config-if># switchport

    <config-if># udld

    <config-if># vlan

    <config-if># voice-vlan

    Description

    Syntax Items

    Description

    authentication

    Apply Auth Manager Port Configuration Commands to the specified

    interface (Ethernet port/LAG port).

    dot1x – Execute the 802.1x authentication.

    guest-vlan – Authenticate the guest VLAN configuration.

    host-mode <multi-auth / multi-host / single-host> - Set the host

    mode for authentication on this port.

    max-hosts <1-256> - Set the maximum number of authenticated hoss

    allowed on this port.

    method <local/radius> - Set authentication method by using local or

    RADIUS server.

    order <dot1x / mac /web> - Add an authentication type to the order

    list.

    port-control <auto / force-auth / force-unauth> - Set the port state

    of this port as AUTO, Authorized or Unauthorized.

    radius-attributes vlan reject – If the Radius server authorizes the

    supplicant, but does not provide a supplicant VLAN, the supplicant

    will be rejected. If the parameter is omitted, the option is applied by

    default.

    radius-attributes vlan static - If the Radius server authorizes the

    supplicant but does not provide asupplicant VLAN, the supplicant will

    be accepted.

    reauth – Enable/Disabel Reauthentication for this port

    timer <inactive> <60-65535> – Set the time value for authentication.

    After the time interval, if there is no activity from the client, it will

    be unauthorized.

    timer quiet <0-65535> - Set the time value to wait failed

    authentication exchange.

    timer reauth <300-4294967294> - Set the time value. After the time

    interval, an automatic re-authentication should be initiated.

    web – Execute the web-based authentication.

    web max-login-attempts <3-10> – Set a maximum number of login

    attemps on the port.

    web max-login-attempts infinite – No limit for login attempts.

    Related Syntax:

    •

    <config-if># authentication dot1x

    •

    <config-if># authentication guest-vlan


    •

    <config-if># authentication host-mode <multi-auth /

    multi-host / single-host>

    •

    <config-if># authentication mac

    •

    <config-if># authentication max-hosts <1-256>

    •

    <config-if># authentication method <local/radius>

    •

    <config-if># authentication order <dot1x / mac /web>

    •

    <config-if># authentication port-control <auto / force-auth /

    force-unauth>

    •

    <config-if># authentication radius-attributes vlan reject

    •

    <config-if># authentication radius-attributes vlan static

    •

    <config-if># authentication reauth

    •

    <config-if># authentication timer inactive <60-65535>

    •

    <config-if># authentication timer quiet <0-65535>

    •

    <config-if># authentication timer reauth <300-4294967294>

    •

    <config-if># authentication web

    •

    <config-if># authentication web max-login-attempts <3-10>

    •

    <config-if># authentication web max-login-attempts infinite

    back-pressure

    Enable back-pressure for the specified interface (Ethernet port/LAG

    port).

    Related Syntax:

    •

    <config-if># back-pressure

    custom

    <enable> - Enable the custom module configuration for the specified

    interface (Ethernet port/LAG port).

    Related Syntax:

    •

    <config-if># custom enable

    description

    Write a description for the specified interface (Ethernet port/LAG

    port).

    <WORD> - Enter a description (up to 32 characters).

    Related Syntax:

    •

    <config-if># descripton <WORD>

    device-check

    Perform a device check the specified interface (Ethernet port/LAG

    port).

    ip-address<A.B.C.D> - Enter the IP address of the device.

    interval <120/15/30/60>– Check the device interval by entering the

    time value. Unit is second.

    retry <1/3/5> - Enter the retry time during a checking period.

    Failure-action <nothing/powercycle/poweroff> – Set the power

    cycle.

    Related Syntax:

    •

    <config-if># device-check ip-address <A.D.C.D> interval

    <120/15/30/60> retry <1/3/5> failure-action

    <nothing/powercycle/poweroff>

    dos

    Apply DoS to the specified interface (Ethernet port/LAG port).

    dot1x

    It is available for GigabitEthernet port only.

    guest-vlan – Set guest VLAN configuration.

    max-req <1-10>– Set the maximum request retries. Default is 2.

    Port-control <auto/force-auth/force-unauth>– Set the port control

    value (auto, authorized or unauthorized)

    reauth – Enable/disable the reauthenctication for this port.

    timeout <quiet-period / reauth-period / server-timeout

    /supp-timeout /tx-period>– Set timeout value for this port.

    <0-65535> - Set a value as quiet period (default is 60-second).

    <300-4294967294> - Set a value as re-authentication period. (default


    is 3600-second).

    <1-65535> - Set a value to wait for a packet retransmission to the

    authentication server.

    supp-timeout <1-65535> – Set a vale as supplicant timeout period.

    tx-period <1-65535> - Set a value to wait for a response to an

    EAP-request / identity before resending the request.

    Related Syntax:

    •

    <config-if># dot1x guest-vlan

    •

    <config-if># dot1x max-req <1-10>

    •

    <config-if># dot1x port-control <auto /force-auth

    /force-unauth >

    •

    <config-if># dot1x reauth

    •

    <config-if># dot1x timeout quiet-period <0-65535>

    •

    <config-if># dot1x timeout reauth-period <300-4294967294>

    •

    <config-if># dot1x timeout server-timeout <1-65535>

    •

    <config-if># dot1x timeout supp-timeout <1-65535>

    •

    <config-if># dot1x timeout tx-period <1-65535>

    do

    Run execution commands in current mode.

    dray_surveillence

    Use this command to set the ONVIF throughput alert threshold.

    <16-1000000> - Specify a number as the alert threshold for egress

    /ingress throughput.

    Related Syntax:

    •

    <config-if>#dray_surveillence set threshold alert egress

    <16-1000000>

    •

    <config-if>#dray_surveillence set threshold alert ingress

    <16-1000000>

    duplex

    Apply the duplex configuration to the specified interface (Ethernet

    port/LAG port).

    <Auto> – Auto duplex configuration.

    <Full>– Force full duplex operation.

    <Half> – Force half-duplex operation.

    Related Syntax:

    •

    <config-if># duplex <auto/full/half>

    eee

    Apply the EEE configuration to the specified interface (Ethernet

    port).

    end

    End current mode, change to enable mode and return to previous

    phase.

    exit

    Exit from current mode.

    flowcontrol

    Configure flow-control mode to the specified interface (Ethernet

    port/LAG port).

    <Auto> – Enable AUTO flow-control configuration.

    <Off> – Disable the force flow-control.

    <On> – Enable the force flow-control.

    Related Syntax:

    •

    <config-if># flowcontrol <auto/off/on>

    gvrp

    Apply the GVRP configuration to the specified interface (Ethernet

    port/LAG port).

    registration-mode <fixed / forbidden / normal>- Set registration

    mode for GVRP. When registration-mode is fixed or forbidden, it will

    remove the dynamic port from VLAN.

    vlan-creation-forbid – Do not remove dynamic port from VLAN.

    Related Syntax:

    •

    <config-if># gvrp registration-mode <fixed / forbidden /


    normal>

    •

    <config-if># gvrp vlan-creation-forbid

    ip

    Apply IP configuration to the specified interface (Ethernet port/LAG

    port).

    acl <NAME> - Specify an ACL for packets. Enter the name of the ACL.

    arp inspection rate-limit <1-10> – ARP inspection is to enable

    Dynamic ARP Inspection function. Set the rate limitation (1 – 10) on

    the interface. VigorSwitch will drop ARP packets after receives more

    than configured rate of packets per second.

    arp inspection trust – Use it to set trusted interface.

    arp inspection validate dst-mac – It means the switch will drop ARP

    reply packets if arp-target-mac and ethernet-dst-mac are not

    matched.

    arp inspection validate ip allow-zeros – The “allow-zeros” means the

    switch will not drop all zero IP address.

    arp inspection validate src-mac – It means the switch will drop ARP

    requests and reply packets if arp-sender-mac and ethernet-

    source-mac are not matched.

    conflict prevention bind-ip <A.B.C.D> -

    conflict prevention port-type DHCP-Client –

    conflict prevention port-type DHCP-Client has-server –

    conflict prevention port-type DHCP-Server –

    conflict prevention port-type DHCP-Server has-server –

    conflict prevention port-type Multiple-Hosts –

    conflict prevention port-type Multiple-Hosts has-server –

    conflict prevention port-type Static-Binding –

    conflict prevention port-type Static-Binding has-server -

    dhcp snooping option – Use it to enable the function of inserting

    option82 content into the packet.

    dhcp snooping option action <drop / keep / replace> - Use it to set

    the action (drop, keep or replace) when receiving packets with

    option82 content.

    dhcp snooping option circuit-id <STRING> - Use it to set user-defined

    circuit-id string (1 to 63 characters).

    dhcp snooping rate-limit <1-300> - Use it to set rate limitation on the

    interface.

    dhcp snooping trust – Use it to set trusted interface.

    dhcp snooping verify mac-address – Use it to verify MAC address

    function on the interface.

    dhcp snooping vlan <1-4094> option circuit-id <STRING> - Set

    user-defined circuit-id string for specified VLAN ID.

    igmp filter <1-128> - Use it to bind a profile for a port. Specify a

    profile ID.

    igmp max-groups <0-256> - Use it to limit port learning max group

    number (0-256).

    igmp max-groups action <deny/replace> - Use it to set the action

    (deny or replace) when the number of groups reach the limitation.

    source binding max-entry <1-10> -

    source binding max-entry no-limit -

    source verify mac-and-ip – Use it to enable IP source guard function.

    Related Syntax:

    •

    <config-if># ip acl <NAME>

    •

    <config-if># ip arp inspection rate-limit <1-10>

    •

    <config-if># ip arp inspection trust

    •

    <config-if># ip arp inspection validate dst-mac

    •

    <config-if># ip arp inspection validate ip allow-zeros


    •

    <config-if># ip arp inspection validate src-mac

    •

    <config-if># ip conflict prevention bind-ip <A.B.C.D>

    •

    <config-if># ip conflict prevention port-type DHCP-Client

    •

    <config-if># ip conflict prevention port-type DHCP-Client

    has-server

    •

    <config-if># ip conflict prevention port-type DHCP-Server

    •

    <config-if># ip conflict prevention port-type DHCP-Server

    has-server

    •

    <config-if># ip conflict prevention port-type Multiple-Hosts

    •

    <config-if># ip conflict prevention port-type Multiple-Hosts

    has-server

    •

    <config-if># ip conflict prevention port-type Static-Binding

    •

    <config-if># ip conflict prevention port-type Static-Binding

    has-server

    •

    <config-if># ip dhcp snooping option

    •

    <config-if># ip dhcp snooping option action <drop / keep /

    replace>

    •

    <config-if># ip dhcp snooping option circuit-id <STRING>

    •

    <config-if># ip dhcp snooping rate-limit <1-300>

    •

    <config-if># ip dhcp snooping trust

    •

    <config-if># ip dhcp snooping verify mac-address

    •

    <config-if># ip dhcp snooping vlan <1-4094> option circuit-id

    <STRING>

    •

    <config-if># ip igmp filter <1-128>

    •

    <config-if># ip igmp max-groups <0-256>

    •

    <config-if># ip igmp max-groups action <deny/replace>

    •

    <config-if># ip source binding max-entry <1-10>

    •

    <config-if># ip source binding max-entry no-limit

    •

    <config-if># ip source verify mac-and-ip

    ipv6

    Apply IPV6 configuration to the specified interface (Ethernet

    port/LAG port).

    acl <NAME> - Specify the ACL name for packets

    mld <filter> – Set IPv6 filter for MLD configuration.

    mld max-groups – Specify the number for maximum group.

    <0-256> - MLD snooping group number.

    action <deny /replace> – Define the action to be performed when

    excessing the maximum group.

    Related Syntax:

    •

    <config-if># ipv6 acl <NAME>

    •

    <config-if># ipv6 mld filter

    •

    <config-if># ipv6 mld max-groups <0-256>

    •

    <config-if># ipv6 mld max-groups action <deny / replace>

    lacp

    Apply LACP Configuration to the specified interface (Ethernet

    port/LAG port).

    <1-65535> - Set a number for IEEE 802.3 link aggregation port

    priority.

    <long/short> – Set long or short timeout value.

    Related Syntax:

    •

    <config-if># lacp port-priority <1-65535>

    •

    <config-if># lacp timeout <long/short>

    lag

    Apply Link Aggregation Group Configuration the specified interface

    (Ethernet port/LAG port).

    <1-8> - Specify LAG number.


    Related Syntax:

    •

    <config-if># lag <1-8>

    loop-protection

    Record the log, shutdown the port or follow the global

    loop-protection settings for each port.

    Related Syntax:

    •

    <config-if># loop-protection action all

    •

    <config-if># loop-protection action global

    •

    <config-if># loop-protection action log

    •

    <config-if># loop-protection action shutdown

    lldp

    med location - Configure the LLDP MED location data. The

    “coordinate”, “civic-address”, “ecs-elin” locations are independent,

    so at most three location TLVs could be sent if their data are not

    empty.

    med network-policy add / remove - Configure the LLDP MED network

    policy table. Add /remove a network policy entry that can be bind to

    ports.

    med tlv-select - Configure LLDP MED TLVs selection. Available

    optional TLVs are network-policy, location, inventory and poe-pse.

    tlv-select - Select LLDP TLVs to send.

    <civic-address> - The location is specified as civic address.

    <ADDR> - Range from 6 to 160 hexadecimal bytes.

    <Coordinate> - The location is specified as coordinates.

    <ADDR> - 16 hexadecimal bytes exactly.

    <ecs-elin> - The location is specified as ECS ELIN.

    <ADDR> - 10 to 25 hexadecimal bytes.

    <IDX_LIST> - Range from 1 to 32.

    <TLV> - LLDP optional TLV, pick from: port-desc, sys-name, sys-desc,

    sys-cap, mac-phy, lag, max-frame-size, management-addr.

    pvid <disable/enable> - Enable or disable the TX optional-TLV 802.1

    PVID.

    vlan-name <add/remove> <2-4094> - Add/remove a selected VLAN.

    Enter the VLAN ID number.

    <rx> - Enable LLDP reception on interface.

    <tx> - Enable LLDP transmission on interface.

    Related Syntax:

    •

    <config-if># lldp med location

    <civic-address/coordinate/ecs-elin> <ADDR>

    •

    <config-if># lldp med network-policy add <IDX_LIST>

    •

    <config-if># lldp med network-policy remove <IDX_LIST>

    •

    <config-if># lldp med tlv-select

    <network-policy/location/inventory/poe-pse>

    <network-policy/location/inventory/poe-pse>

    <network-policy/location/inventory/poe-pse>

    •

    <config-if># lldp tlv-select <TLV/pvid/vlan-name>

    •

    <config-if># lldp tlv-select pvid <disable/enable>

    •

    <config-if># lldp tlv-select vlan-name <add/remove> <2-4094>

    •

    <config-if># lldp <rx/tx>

    mac

    Specify an access control list for packets.

    Before configuring, you have to create an ACL based on MAC address.

    For example,

    <config># mac acl CA_ACL

    <config-mac-acl>#

    <NAME> - Enter a name for ACL.

    Related Syntax:


    •

    <config-if># mac acl <NAME>

    mvr

    Make MVR configuration.

    immediate - Enable MVR function.

    type <receiver/source> - Specify MVR port type as receiver or source.

    Related Syntax:

    •

    <config-if># mvr immediate

    •

    <config-if># mvr type <receiver/source>

    no

    Negate command. Such command can disable current setting of

    command executed and return to the factory setting of that

    command.

    Example:

    <config-if> # no mvr

    The operation will make mvr setting is default. Continue?

    [yes/no]:yes

    <config-if> #

    Related Syntax:

    •

    <config-if># no <command>

    poe

    Enable or disable the PoE port.

    port-security

    port-security - Enable the port security functionality. Default is

    disabled.

    address-limit <1-256>- Enter the number as limitation for MAC

    address.

    action <discard / forward / shutdown> – Speicfy an action to be

    performed.

    Related Syntax:

    •

    <config-if># port-security

    •

    <config-if># port-security adderss-limit <1-256> action

    <discard / forward / shutdown>

    power

    Configure the inline power for the PoE device.

    inline auto - Turn on the PoE device discovery protocol and apply the

    power to the devcie.

    inline never - Turn off the PoE device power.

    power-limit <15.4w/30w/MW> - Set the power limit for the PoE

    device.

    priority <1-3/critical/high/low> - Set the priority of power

    application for the PoE device.

    schedule-index - Specify the index number of the schedule profile.

    Related Syntax:

    •

    <config-if># power inline auto

    •

    <config-if># power inline never

    •

    <config-if># power power-limit <15.4w/30w/MW>

    •

    <config-if># power priority <1-3/critical/high/low>

    •

    <config-if># power schedule-index

    protected

    Configure an interface to be a protected port.

    Related Syntax:

    •

    <config-if>#protected

    qos

    cos - Configure the default CoS value for an Ethernet port.

    <0-7> - Specify a CoS value for the selected interface. Default value

    is 0.

    remark - Configure remarking state of each port.

    trust - Configure each port to trust state while the system is in

    “basic” mode. There are four trust types for a device to judge the

    appropriate queue of the packets.


    <cos> - Enable cos remarking.

    <dscp> - Enable DSCP remarking.

    <cos-dscp> - Enable cos and DSCP remarking.

    <precedence> - Enable IP precedence remarking.

    Related Syntax:

    •

    <config-if>#qos cos <0-7>

    •

    <config-if>#qos remark <cos/dscp/precedence>

    •

    <config-if>#qos trust <cos/cos-dscp/ dscp/precedence>

    rate-limit

    It is effective for Ethernet port only.

    egress - Configure the egress port shaper.

    ingress - Configure the ingress port shaper.

    egress queue – Configure queue for egress port shaper.

    <0-1000000> - Enter a number as the average traffic rate in Kbps. It

    must be a multiple of 16.

    <16-1000000> - Enter a number as the average traffic rate in Kbps. It

    must be a multiple of 16.

    <1-8> - Specify a nubmer as queue ID.

    Related Syntax:

    •

    <config-if># rate-limit egress <0-1000000>

    •

    <config-if># rate-limit egress queue <1-8> <16-1000000>

    •

    <config-if># rate-limit ingress <16-1000000>

    shutdown

    Disable the selected interface.

    Example:

    (config)# interface gigabitethernet 3

    (config-if)# shutdown

    (config-if)# exit

    (config)# exit

    # show interface Gigabitethernet 3

    GigabitEthernet3 is down

    Related Syntax:

    •

    <config-if># shutdown

    spanning-tree

    Configure spanning-tree settings.

    bpdu-filter - Set the BPDU-Filter for specified port.

    bpdu-guard - Set the BPDU-Guard for specified port.

    edge - Set the edge-port for specified port.

    cost - Change an interface’s spanning tree path cost.

    link-type - Specify a link type for spanning tree protocol use.

    mcheck - Set the mcheck for specified port to migrate.

    mst - Set spanning-tree parameters of instance.

    port-priority- Set the priority for specified instance.

    <0-200000000> - Specify a value of internal path cost (0 means Auto).

    <point-to-point> - The selected port will be treated as

    point-to-point.

    <shared> - The selected port will be treated as shared.

    <0-15> - Specify an instance ID.

    <0-240> - Specify a priority number for the selected port.

    Related Syntax:

    •

    <config-if># spanning-tree <bpdu-filter /bpdu-guard/ edge>

    •

    <config-if># spanning-tree cost <0-200000000>

    •

    <config-if># spanning-tree link-type <point-to-point/shared>

    •

    <config-if>#spanning-tree mcheck

    •

    <config-if>#spanning-tree mst <0-15> cost <0-200000000>


    •

    <config-if># spanning-tree port-priority <0-240>

    speed

    Configure speed operation.

    <10/100/1000> - Force 10/100/1000 Mbps operation.

    <auto> - Enable Auto speed configuration.

    Related Syntax:

    •

    <config-if># speed<10/100/1000>

    •

    <config-if># speed auto

    storm-control

    action - Select an action for storm control after exceeding the

    threshold.

    broadcast level - Enable the storm control type of broadcast for the

    selected port.

    unknown-multicast level - Enable the storm control type of

    unknown-multicast for the selected port.

    unknown-unicast level- Enable the storm control type of

    unknown-unicast for the selected port.

    <drop> - Drop packets after exceeding storm control threshold.

    <shutdown> - Disable the port after exceeding storm control

    threshold.

    <1-1000000> - Specify the rate value.

    Related Syntax:

    •

    <config-if># storm-control action <drop/shutdown>

    •

    <config-if># storm-control broadcast level <1-1000000>

    •

    <config-if># storm-control unknown-multicast level

    <1-1000000>

    •

    <config-if># storm-control unknown-unicast level <1-1000000>

    surveillance-vlan

    cos - Set surveillance VLAN configuration.

    mode - Set surveillance member port join mode.

    <all> - QoS attributes are applied to all packets that are classified to

    the Surveillance VLAN.

    <src> - QoS attributes are applied only on packets from IP phones.

    <auto> - Make surveillance member port join voice VLAN

    automatically.

    <manual> - The administrator manually makes surveillance member

    port join voice VLAN.

    Related Syntax:

    •

    <config-if># surveillance-vlan cos <all/src>

    •

    <config-if># surveillance-vlan mode <auto/manual>

    switchport

    Set switching mode characteristics.

    access vlan –Use it to set a native VLAN on the interface.

    default-vlan tagged – Use it to make the selected port interface to

    become the default VLAN tagged member.

    forbidden default-vlan – Use it to forbid the defult-vlan on the

    interface.

    forbidden vlan - Use it to forbid a vlan on the interface.

    hybrid accetable-frame-type – Use it to choose which type of frame

    will be accepted.

    hybrid allowed – Use it to allow a VALN set on the interface.

    hybrid ingress-filtering – Use it to enable VLAN ingress filter.

    hybrid pvid – Use it to set PVID of the interface.

    mode access - Use it to configure the selected port as the role of

    access. Only untagged frames will be accepted.

    mode hybrid - Use it to configure the selected port as the role of

    hybrid. Support all functions defined in IEEE 802.1Q specification.

    mode trunk uplink – Use it to configure the selected port as the role


    of trunk. It can recognize double tagging on the interface.

    trunk allowed – Use it to allow a VALN on the interface.

    trunk native – Use it to set a native VLAN on the interface.

    tunnel vlan – Use it to set a Dot1q tunnel VLAN on the interface.

    vlan tpid – Use it to set TPID on the interface.

    <1-4094> - Specify a VLAN ID.

    <add/remove> - Add or remove the allowed VLAN list.

    <all/tagged-only/untagged-only> - Specify an option for accepting all

    frames, only tagged frames or only untagged frames.

    <1-4094/all> - Specify a VLAN ID or all VLAN IDs.

    < 0x8100 / 0x88A8 / 0x9100 / 0x9200> - Specify one tag-protocol-id.

    Related Syntax:

    •

    <config-if># switchport access vlan <1-4094>

    •

    <config-if># switchport default-vlan tagged

    •

    <config-if># switchport forbidden default-vlan

    •

    <config-if># switchport forbidden vlan <add/remove> <1-4094>

    •

    <config-if># switchport hybrid accetable-frame-type

    <all/tagged-only/untagged-only>

    •

    <config-if># switchport hybrid allowed vlan add <1-4094>

    •

    <config-if># switchport hybrid allowed vlan add <1-4094>

    <tagged/ untagged>

    •

    <config-if># switchport hybrid allowed vlan remove <1-4094>

    •

    <config-if># switchport hybrid ingress-filtering

    •

    <config-if># switchport hybrid pvid <1-4094>

    •

    <config-if># switchport mode <access/hybrid>

    •

    <config-if># switchport mode trunk uplink

    •

    <config-if># switchport trunk allowed vlan <add /remove>

    <1-4094/all>

    •

    <config-if># switchport trunk native <1-4094>

    •

    <config-if># switchport tunnel vlan <1-4094>

    •

    <config-if># switchport vlan tpid < 0x8100/0x88A8 / 0x9100 /

    0x9200>

    udld

    Configure UDLD enabled or disabled and ignore global UDLD setting.

    aggressive - Enable UDLD protocol on such interface.

    Related Syntax:

    •

    <config-if># udld

    •

    <config-if># udld aggressive

    vlan

    mac-vlan group - Set a MAC-based VLAN configuration.

    protocol-vlan group - Set a protocol-based VLAN configuration.

    <1-2147483647> - Specify a group ID to map.

    <1-4094> - Specify a VLAN ID.

    Related Syntax:

    •

    <config-if># vlan mac-vlan group <1-2147483647> vlan

    <1-4094>

    •

    <config-if># vlan protocol-vlan group<1-2147483647> vlan

    <1-4094>

    voice-vlan

    cos - Set voice VLAN configuration as COS mode.

    mode - Set voice member port join mode.

    <all> - QoS attributes are applied on all packets that are classified to

    the Voice VLAN.

    <src> - QoS attributes are applied only on packets from IP phones.

    <auto> - Make voice member port join voice VLAN automatically.

    <manual> - The administrator manually makes voice member port


    join voice VLAN.

    Related Syntax:

    •

    <config-if># voice-vlan cos <all/src>

    •

    <config-if># voice-vlan mode <auto/manual>

    Example

