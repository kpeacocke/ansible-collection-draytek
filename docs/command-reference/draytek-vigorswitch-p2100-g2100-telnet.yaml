    Set the LLDP re-initial delay to avoid LLDP generating too many

    PDU.

    <1-10> - Specify a number for LLDP server to initialize.

    Related Syntax:

    •

    <config># lldp rinit-delay <1-10>

    lldp tx-delay

    Set the delay time between the successful LLDP frame

    transmissions.

    <1-8191> - Enter the number of delay time.

