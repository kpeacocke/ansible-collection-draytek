    P2100# configure

    P2100(config)# mac acl test_CA

    P2100(config-mac-acl)# deny 00:50:00:7f:12:11/00:00:00:00:10:20

    00:50:00:aa:bb:cc/00:00:00:00:12:00 cos 3 2 ethtype 0x0600

    P2100(config-mac-acl)# deny any 00:50:00:7f:12:11/00:00:00:00:10:20 cos 5 6

    ethtype 0x0600

    P2100(config-mac-acl)# deny any

    P2100(config)# mac address-table static 00:50:07:12:ff:aa vlan 300 drop'
