  related_syntax:
  - '<config># mailalert active <disable/enable> mailalert auth <disable/enable> - Enable or disable the function of SMTP
    server authentication. Related Syntax:'
  - '<config># mailalert auth <disable/enable> mailalert devicecheck <disable/enable> - Enable or disable the function of
    sending a mail alert when encountering a device check error. Related Syntax:'
  - '<config># mailalert devicecheck <disable/enable> mailalert encpassword <PASSWORD> - Set a encryption authentication password
    for the mail alert. Related Syntax:'
  - '<config># mailalert encpassword PASSWORD mailalert encry <disable/ssltls/starttls> - Specify the encryption type for
    mail alert. Related Syntax:'
  - '<config># mailalert encry <disable/ ssltls/starttls> mailalert hwmon Send a mail alert when hardware monitor error. <disable/enable>
    - Enable or disable the function. Related Syntax:'
  - '<config># mailalert hwmon <disable/enable> mailalert interval Set the transmission interval for the mail alert. <1-60>
    - Unit is second. Related Syntax:'
  - '<config># mailalert interval <1-60> mailalert ipconflict <disable/enable> - Enable or disable the function of sending
    a mail alert if encountering the IP conflict. Related Syntax:'
  - '<config># mailalert ipconflict <disable/enable> mailalert password <PASSWORD> - Enter the password for SMTP server authentication.
    Related Syntax:'
  - '<config># mailalert password <PASSWORD> mailalert poestatus <disable/enable> - Enable or disable the function of sending
    a mail alert when PoE status is changed. Related Syntax:'
  - '<config># mailalert poestatus <disable/enable> mailalert port <0-65535>- Enter a port number. Related Syntax: <config>#
    mailalert port <0-65535> mailalert portlink <disable/enable> - Enable or disable the function of sending an alert when
    the port lnik status changes. Related Syntax:'
  - '<config># mailalert portlink <disable/enable> mailalert portspeed <disable/enable> - Enable or disable the function of
    sending an alert when the port link speed changes. Related Syntax:'
  - '<config># mailalert portspeed <disable/enable> mailalert receiver Specify an address for receiving the alart mail. <ADDRESS>
    - Enter the email address of the receiver. Related Syntax:'
  - '<config># mailalert receiver <ADDRESS> mailalert sender Specify an address which sends out the alert mail. <ADDRESS>
    - Enter the email address of the sender. Related Syntax:'
  - '<config># mailalert sender <ADDRESS> mailalert server Set the IP address of the server. <ADDRESS> - Enter the IP address
    of the SMTP server. Related Syntax:'
  - '<config># mailalert server <ADDRESS> mailalert sysrestart <disable/enable> -Enable or disable the function of sending
    a mail alert when the system restarts. Related Syntax:'
  - '<config># mailalert sysrestart <disable/enable> mailalert throughputcheck <disable/enable> - Enable or disable the function
    of sending a mail alert when reaching the throughput threshold. Related Syntax:'
  - '<config># mailalert throughputcheck <disable/enable> mailalert username <NAME> - Enter the username authenticated by
    STMP server. Related Syntax:'
  - <config># mailalert username <NAME>
  examples:
  - configure
  source_reference: 'Telnet Command: mailalert

    Use this command to configure mail alert for various conditions.

    Syntax Items

    mailalert active

    mailalert auth

    mailalert devicecheck

    mailalert encpassword

    mailalert encry

    mailalert hwmon

    mailalert interval

    mailalert ipconfilict

    mailalert password

    mailalert poestatus

    mailalert port

    mailalert portlink


    mailalert portspeed

    mailalert receiver

    mailalert sender

    mailalert server

    mailalert sysrestart

    mailalert throughputcheck

    mailalert username

    Description

    Syntax Items

    Description

    mailalert active

    <disable/enable> - Enable or disable the function of mail alert.

    Related Syntax:

    •

    <config># mailalert active <disable/enable>

    mailalert auth

    <disable/enable> - Enable or disable the function of SMTP server

    authentication.

    Related Syntax:

    •

    <config># mailalert auth <disable/enable>

    mailalert devicecheck

    <disable/enable> - Enable or disable the function of sending a mail

    alert when encountering a device check error.

    Related Syntax:

    •

    <config># mailalert devicecheck <disable/enable>

    mailalert encpassword

    <PASSWORD> - Set a encryption authentication password for the

    mail alert.

    Related Syntax:

    •

    <config># mailalert encpassword PASSWORD

    mailalert encry

    <disable/ssltls/starttls> - Specify the encryption type for mail alert.

    Related Syntax:

    •

    <config># mailalert encry <disable/ ssltls/starttls>

    mailalert hwmon

    Send a mail alert when hardware monitor error.

    <disable/enable> - Enable or disable the function.

    Related Syntax:

    •

    <config># mailalert hwmon <disable/enable>

    mailalert interval

    Set the transmission interval for the mail alert.

    <1-60> - Unit is second.

    Related Syntax:

    •

    <config># mailalert interval <1-60>

    mailalert ipconflict

    <disable/enable> - Enable or disable the function of sending a mail

    alert if encountering the IP conflict.

    Related Syntax:

    •

    <config># mailalert ipconflict <disable/enable>

    mailalert password

    <PASSWORD> - Enter the password for SMTP server authentication.

    Related Syntax:

    •

    <config># mailalert password <PASSWORD>

    mailalert poestatus

    <disable/enable> - Enable or disable the function of sending a mail

    alert when PoE status is changed.

    Related Syntax:

    •

    <config># mailalert poestatus <disable/enable>

    mailalert port

    <0-65535>- Enter a port number.

    Related Syntax:

    <config># mailalert port <0-65535>


    mailalert portlink

    <disable/enable> - Enable or disable the function of sending an

    alert when the port lnik status changes.

    Related Syntax:

    •

    <config># mailalert portlink <disable/enable>

    mailalert portspeed

    <disable/enable> - Enable or disable the function of sending an

    alert when the port link speed changes.

    Related Syntax:

    •

    <config># mailalert portspeed <disable/enable>

    mailalert receiver

    Specify an address for receiving the alart mail.

    <ADDRESS> - Enter the email address of the receiver.

    Related Syntax:

    •

    <config># mailalert receiver <ADDRESS>

    mailalert sender

    Specify an address which sends out the alert mail.

    <ADDRESS> - Enter the email address of the sender.

    Related Syntax:

    •

    <config># mailalert sender <ADDRESS>

    mailalert server

    Set the IP address of the server.

    <ADDRESS> - Enter the IP address of the SMTP server.

    Related Syntax:

    •

    <config># mailalert server <ADDRESS>

    mailalert sysrestart

    <disable/enable> -Enable or disable the function of sending a mail

    alert when the system restarts.

    Related Syntax:

    •

    <config># mailalert sysrestart <disable/enable>

    mailalert throughputcheck

    <disable/enable> - Enable or disable the function of sending a mail

    alert when reaching the throughput threshold.

    Related Syntax:

    •

    <config># mailalert throughputcheck <disable/enable>

    mailalert username

    <NAME> - Enter the username authenticated by STMP server.

    Related Syntax:

    •

    <config># mailalert username <NAME>

    Example

    P2100# configure

    P2100(config)#

    P2100(config)# mailalert receiver carrie_ni@draytek.com'
