    Description\nvoice-vlan aging-time\nSet the voice VLAN aging timeout interval.\n<30-65536> - The unit is minute. Default\
    \ is 1440 (minutes).\n<string> - Enter the name of the VLAN profile.\nRelated Syntax:\n•\n<config># voice-vlan aging-time\
    \ <30-65536>\nvoice-vlan cos\nSet the voice VLAN cos value and remark function.\nSpecify the class of service for voice\
    \ VLAN.\n<0-7> - CoS value. Default is 6. Remark is disabled.\nremark – L2 user priority is remarked with the CoS value.\n\
    Related Syntax:\n•\n<config># voice-vlan cos <0-7> remark\nvoice-vlan oui-table\nAdd or remove the selected OUI to/from\
    \ the OUI table. In default,\nthere are 8 OUI addresses.\n<A:B:C> - Enter the OUI address.\n<DESCRIPTION> - Enter a brief\
    \ description for the specified MAC\naddress to the voice VLAN OUI table.\nRelated Syntax:\n•\n<config># voice-vlan cos\
    \ <0-7> remark\nvoice-vlan vlan\nSet the VLAN identifier of the voice VLAN.\n<2-4094> - Enter the number of VLAN ID.\n\
    Related Syntax:\n•\n<config># voice-vlan vlan <2-4094>\nExample\nP2100# configure\nP2100(config)# voice-vlan aging-time\
    \ 1000\nP2100(config)#\nP2100(config)# voice-vlan oui-table 22:30:ff test_01\n\nP2100(config)#\nP2100(config)# voice-vlan\
    \ oui-table 00:01:E2 STAMP\nP2100(config)# exit\nP2100# show voice-vlan interfaces gigabitEthernet 1\nVoice VLAN Aging\
