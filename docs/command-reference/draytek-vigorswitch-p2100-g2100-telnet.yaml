  - '<config># authentication guest-vlan <1-4094> authentication mac Enable MAC authentication by entering the word, mac after
    authentication. mac local - Local database for MAC-Based authentication. It can add local MAC authentication hosts in
    database. <A:B:C:D:E:F> - Enter the MAC address to be added for authentication. control auth – Set a local entry control
