schema_version: '1.0'
catalogue_type: vendor_cli_source_catalogue
source:
  vendor: DrayTek
  product_family: VigorSwitch P2100/G2100
  document: VigorSwitch P2100/G2100 PoE L2+/L2+ Managed Switch User’s Guide
  document_version: '1.3'
  firmware_version: V2.8.3
  document_date: '2023-09-12'
  manual_part: Part XIII - Telnet Commands
  manual_command_pages: 252-359
  pdf_pages: 262-369
  transport_context:
  - telnet
  - console CLI
  - SSH is documented by the manual as a management interface, but command parity must not be assumed without device validation
generation:
  records: 83
  method: Structured extraction from documented Telnet command families and top-level command sections. Full source-reference
    text is retained per record so implementation agents can inspect documentation without inventing omitted semantics.
  limitations:
  - A command family can contain many nested syntax variants. syntax_items and related_syntax are extraction aids; source_reference
    is the source-preserving fallback.
  - The catalogue does not assert that every documented command is available on every firmware build or both P2100 and G2100
    variants.
  - No Ansible idempotency behaviour is treated as vendor-documented unless explicitly stated in the source.
rules:
- Do not invent DrayTek commands, modes, arguments, ranges, defaults, or output.
- Do not assume Cisco IOS semantics merely because the CLI has configure/interface/show style commands.
- Treat source_reference as evidence; treat ansible_mapping as design guidance only.
- A mutating Ansible resource must discover current state before changing it wherever a reliable read path exists.
- If current state cannot be determined reliably, do not claim idempotency; expose the limitation or defer the resource.
- Do not assume Telnet and SSH expose identical command behaviour until validated against a real device/firmware.
- Destructive commands such as restore-defaults, reboot, delete, copy/upgrade, and shutdown-related operations require explicit
  safety handling.
