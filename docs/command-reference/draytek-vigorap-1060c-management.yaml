  settings:
    check_time_default_seconds: 15
    5ghz_minimum_rssi: dBm threshold
    2_4ghz_utilisation_overload_threshold_default: 70%
    5ghz_utilisation_overload_threshold_default: 70%
  source_pages:
  - 56
  - 57
  - 58
  - 59
  - 60
  ansible_mapping:
    status: proposed
    resource: band_steering
- id: station-list
  menu_path: Wireless LAN > Station List
  category: facts
  purpose: Show connected clients, statistics, block list and white list.
