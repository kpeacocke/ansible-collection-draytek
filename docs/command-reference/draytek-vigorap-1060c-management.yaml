- id: ap-discovery
  menu_path: Wireless LAN > AP Discovery
  category: diagnostics
  purpose: Scan regulatory channels for neighbouring APs and assist WDS selection.
  notes:
  - Scan takes about 5 seconds.
  - Clients cannot connect during the scan.
  observed_fields:
  - SSID
  - BSSID
  - RSSI
  - Channel
  - Encryption
  - Authentication
  source_pages:
  - 49
  - 50
  ansible_mapping:
    status: proposed
    resource: ap_discovery_facts
- id: wds-status
  menu_path: Wireless LAN > WDS AP Status
  category: diagnostics
  purpose: Display WDS peer status.
  notes:
  - Available for 5GHz only.
  source_pages:
  - 50
  ansible_mapping:
    status: proposed
    resource: wds_facts
- id: airtime-fairness
  menu_path: Wireless LAN > Airtime Fairness
  category: wireless
  purpose: Control airtime allocation between clients and SSIDs.
  settings:
    mode:
    - Basic
    - Advanced
    - Disable
    advanced_ssid_airtime:
      range: 0-100
  source_pages:
  - 50
  - 51
  - 52
  ansible_mapping:
    status: proposed
    resource: airtime_fairness
- id: station-control
  menu_path: Wireless LAN > Station Control
  category: wireless
  purpose: Limit client connection and reconnection durations by SSID.
  notes:
