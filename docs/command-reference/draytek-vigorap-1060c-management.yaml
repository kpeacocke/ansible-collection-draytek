schema_version: '1.0'
source:
  vendor: DrayTek
  product: VigorAP 1060C
  document: VigorAP 1060C User's Guide
  manual_version: '1.4'
  firmware_version: V1.4.9
  date: '2023-07-17'
  evidence_type: web-ui-management
  important_limitation: The manual confirms Telnet server enablement but does not
    provide a Telnet CLI command reference. No CLI commands, HTTP endpoints, private
    APIs, or request payloads are inferred here.
records:
- id: operation-mode
  menu_path: Operation Mode
  category: connectivity
  purpose: Select the operating role of the VigorAP 1060C.
  documented_values:
  - AP
  - Mesh Root
  - Mesh Node
  - Range Extender
  behaviour:
    AP: Wireless clients connect to the AP and exchange data with devices on the wired
      network.
    Mesh Root: Must connect to a gateway using Ethernet.
    Mesh Node: Connects to a mesh root or another mesh node, wirelessly or via Ethernet
      where supported.
    Range Extender: Acts as station and AP simultaneously to extend a root AP.
  source_pages:
  - 32
  - 33
  ansible_mapping:
    status: proposed
    resource: operation_mode
- id: wlan-general
  menu_path: Wireless LAN (2.4GHz/5GHz) > General Setup
  category: wireless
  purpose: Configure radio enablement, client limits, mode, channel, SSIDs, isolation,
    VLANs and WDS peer information.
  settings:
    enable_wireless_lan: boolean
    client_limit:
      range: 3-128
    client_limit_per_ssid:
      range: 3-128
    channel: channel or AutoSelect
    ssid_count:
      maximum: 8
    hide_ssid: boolean
    isolate_lan: boolean
    isolate_member: boolean
    vlan_id:
      range: 3-4095
      default: 0
      default_meaning: VLAN disabled for SSID
    security_algorithm:
    - WEP
    - TKIP
    - AES
    peer_mac_address: MAC address for WDS peer
  source_pages:
  - 38
  - 39
  - 40
  ansible_mapping:
    status: proposed
    resource: wireless_ssids
- id: wlan-security
  menu_path: Wireless LAN (2.4GHz/5GHz) > Security
  category: wireless
  purpose: Configure per-SSID wireless authentication and encryption.
  documented_values:
    modes:
    - WPA3 Personal
    - WPA3/WPA2 Personal
    - WPA2 Personal
    - WPA2/WPA Personal
    - WPA3 Enterprise
    - WPA3/WPA2 Enterprise
    - WPA2 Enterprise
    - WPA2/WPA Enterprise
    - OWE
    - WPA Personal
    - WPA Enterprise
    - WEP Personal
    - WEP Enterprise
    - None
    wpa_algorithms:
    - TKIP
    - AES
    - TKIP/AES
  settings:
    pass_phrase: 8-63 ASCII characters or 64 hexadecimal digits prefixed by 0x
    key_renewal_interval:
      default_seconds: 3600
      zero_meaning: disable re-key
    eapol_key_retry: enable/disable
    wep_keys: Four keys; one active at a time
  source_pages:
  - 41
  - 42
  ansible_mapping:
    status: proposed
    resource: wireless_security
- id: wireless-radius-client
  menu_path: Wireless LAN > Security > RADIUS Server
  category: authentication
  purpose: Use the internal or an external RADIUS server for WLAN authentication.
  settings:
    use_internal_radius_server: boolean
    external_radius_ip: IPv4 address
    external_radius_port:
      default: 1812
    shared_secret: string
    session_timeout: seconds; zero triggers immediate re-authentication after success
  source_pages:
  - 43
  ansible_mapping:
    status: proposed
    resource: radius_client
- id: wlan-access-control
  menu_path: Wireless LAN > Access Control
  category: wireless
  purpose: Control WLAN access by MAC address and device objects/groups.
  settings:
    policy:
    - disabled
    - activate MAC address filter
    - blocked MAC address filter
    mac_address_filter: add/delete/edit
    device_group: reference existing device group
    device_object: reference existing device object
    backup_restore: supported
  source_pages:
  - 44
  - 45
  ansible_mapping:
    status: proposed
    resource: wireless_access_control
- id: wps
  menu_path: Wireless LAN > WPS
  category: wireless
  purpose: Configure Wi-Fi Protected Setup.
  settings:
    enable_wps: boolean
    supported_auth_modes:
    - WPA2/PSK
    - WPA/PSK
    methods:
