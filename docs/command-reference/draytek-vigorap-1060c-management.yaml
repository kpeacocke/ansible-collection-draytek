- id: mesh-setup
  menu_path: Mesh > Mesh Setup
  category: mesh
  purpose: Configure mesh root/node roles and mesh-group membership.
  constraints:
    maximum_devices: 8
    composition: 1 mesh root plus 0-7 mesh nodes
