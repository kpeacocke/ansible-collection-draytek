- id: roaming
  menu_path: Wireless LAN > Roaming
  category: wireless
  purpose: Configure 802.11r and AP-assisted roaming thresholds.
  settings:
    enable_802_11r: available for WPA2 Enterprise, WPA2 Personal, WPA3/WPA2 Enterprise,
      WPA3/WPA2 Personal
    minimum_basic_rate: Mbps threshold
    rssi_requirement:
    - disabled
    - strict minimum RSSI
    - minimum RSSI with adjacent AP threshold
    fast_roaming_wpa2_enterprise:
    - PMK caching
    - pre-authentication
  source_pages:
  - 54
  - 55
