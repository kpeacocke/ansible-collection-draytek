    - Client PIN
  source_pages:
  - 46
  ansible_mapping:
    status: proposed
    resource: wps
- id: wlan-advanced
  menu_path: Wireless LAN > Advanced Setting
  category: wireless
  purpose: Configure channel width, power, thresholds, multicast and isolation behaviour.
  settings:
    channel_bandwidth:
    - 20 MHz
    - Auto 20/40 MHz
    - 40 MHz
    - Auto 20/40/80 MHz
    - Auto 20/40/80/160 MHz
    tx_power_default: 100%
    fragment_length_default: 2346
    rts_threshold_default: 2347
    country_code: 802.11d country code
    igmp_snooping: enable/disable
    isolate_ssids_default: Enable
    isolate_members_with_ip_default: Disable
    wmm_capable: enable/disable
    apsd_capable_default: Disable
    mac_clone: 2.4GHz only
  source_pages:
  - 47
  - 48
  ansible_mapping:
    status: proposed
