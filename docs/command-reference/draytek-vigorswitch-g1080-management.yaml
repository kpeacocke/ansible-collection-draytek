  pdf_page_count: 41
  identity_pdf_page: 2
  page_convention: Printed Arabic page + 4 = physical PDF page (1-based).
scope:
  coverage: All Chapter 3 management sections plus relevant capability/access evidence. Not exhaustive
    screenshot transcription.
  unknown_value_policy: null means not established, never zero/disabled/unlimited.
  source_inheritance: Every setting and statement inherits record source_pages; proposals are separately
    labelled.
  device_tested: false
transport_evidence:
  web_ui: Documented through Ethernet/browser.
  cli_syntax: null
  telnet_support: null
  ssh_support: null
  http_endpoints: null
  cgi_paths: null
  api_contract: null
  snmp_contract: null
records:
- id: capabilities
  manual_evidence:
    surface: web_ui
    menu_path:
    - Device capabilities
    section: 1.1; 1.2
    source_pages:
    - manual_page: 1
      pdf_page: 5
    - manual_page: 2
      pdf_page: 6
    settings: []
    behaviours:
    - Eight 10/100/1000Mbps copper ports; web management; VLAN, QoS and aggregation described.
    constraints: []
    prerequisites: []
    notes:
    - Feature overview mentions static trunking, 8K MAC entries, 9KB jumbo frames and up to 9600-byte
      packets. These are overview claims, not writable controls.
    - Generic SFP and trap references do not establish an SFP port or an SNMP configuration API on G1080.
  proposed_ansible_mapping:
    status: proposal_only_not_implemented
    resource: vigorswitch_g1080_capabilities
    operation_class: reference
    transport: null
    readback: null
    idempotency: not_established
