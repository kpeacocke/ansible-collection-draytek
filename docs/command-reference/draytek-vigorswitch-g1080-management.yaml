- id: loop_prevention
  manual_evidence:
    surface: web_ui
    menu_path:
    - Loop Prevention
    section: 3.2; 3.10; 4.2
    source_pages:
    - manual_page: 25
      pdf_page: 29
    - manual_page: 33
      pdf_page: 37
    - manual_page: 37
      pdf_page: 41
    settings:
    - name: Loop Control
      description: ''
      options:
      - 'Off'
      - Loop Detection Only
      - Loop Detection&Prevention
      documented_default: null
      documented_range: null
      sensitive: false
    - name: Apply
      description: ''
      options: null
      documented_default: null
      documented_range: null
      sensitive: false
    behaviours:
    - Sends detection frames to identify loops.
    - Off disables loop control.
    - Manual says Loop Detection Only automatically shuts down a looped port and reactivates it when loop
      disappears.
    - Manual says Loop Detection&Prevention automatically shuts down a looped port.
    constraints: []
    prerequisites: []
    notes:
    - Recovery behaviour for Detection&Prevention is not stated. Do not assume STP/RSTP equivalence.
    - Troubleshooting claims loop detection is enabled by default but points to STP menus absent from
      Chapter 3. Default mode and those menu paths require verification; not adopted as actionable G1080
      settings.
  proposed_ansible_mapping:
