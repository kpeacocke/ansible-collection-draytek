schema_version: '1.0'
catalogue_kind: management_evidence_not_command_reference
source:
  vendor: DrayTek
  product: VigorAP 918R Series
  document: VigorAP 918R User's Guide
  version: '1.6'
  firmware: V1.4.6
  date: '2023-07-05'
  filename: DrayTek_UG_VigorAP 918R_V1.6.pdf
  sha256: 5294aa03889efee6f98b6c81885f31ad355a7880da59e9841b13a137d4a3ba6d
  pdf_page_count: 183
  identity_pdf_page: 2
  page_convention: manual_page is printed Arabic page; pdf_page is 1-based physical page. PDF page = manual
    page + 8.
scope:
  status: manual_derived_not_device_tested
  earlier_package: Equivalent requested file layout and evidence/proposal separation; earlier 1060C generated
    files unavailable for exact schema comparison.
  coverage: Management/configuration section catalogue; screenshot-only pages are explicitly partial.
    Not a transcription of every screenshot field.
  unknown_value_policy: null means not established from cited evidence; never means zero, disabled, unlimited,
    optional or supported.
  page_inheritance: Each setting, behavior, constraint and prerequisite inherits its record source_pages;
    section is the locator within those pages.
transport_evidence:
  web_ui: Documented management surface, manual p15.
  telnet: Enablement and CLI existence documented on p108; commands not documented.
  cli_syntax: null
  http_endpoints: null
  cgi_paths: null
  api_contract: null
  tr069: Service setup documented; parameter tree and ACS API not supplied.
  snmp: Agent setup documented; OIDs/MIBs and writable objects not supplied.
  mobile_app: User workflow documented; protocol and API not supplied.
