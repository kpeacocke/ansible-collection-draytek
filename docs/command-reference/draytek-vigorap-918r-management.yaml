        64_bit: 5 ASCII or 10 hex
        128_bit: 13 ASCII or 26 hex
        ascii_codes: '33-126 excluding # and comma'
      unit: null
      sensitive: true
    behaviours:
    - Security is configured independently for SSID 1-4.
    - OWE is described as passwordless per-client encrypted access.
    constraints:
    - Only one of four WEP keys is selected at a time.
    - Controls depend on selected security mode; the manual says WPA3 algorithms are AES.
    prerequisites: []
    notes:
    - The text repeats WPA2 Enterprise, mixes PSK/802.1x descriptions, and refers to Vigor router. Preserve
