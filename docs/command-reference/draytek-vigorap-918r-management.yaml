      options: null
      documented_default: null
      documented_range: null
      unit: null
      sensitive: false
    - name: Auto Logout
      description: Named control or displayed field in the cited manual section.
      options: null
      documented_default: Auto Logout after 5 minutes inactivity
      documented_range: null
      unit: minutes
      sensitive: false
    behaviours:
    - The manual directs configuration of all functions and settings through the Web UI.
    - Wireless access may use the documented hostname vigorap.com.
    constraints: []
    prerequisites:
    - PC has network reachability; use DHCP or an address in the same subnet.
    notes:
    - The manual documents initial admin/admin credentials; do not use them as an automation credential
      fallback.
    - A browser entry address is not a configuration endpoint or API.
    evidence_basis: Manual prose/tables; screenshot-derived details only when explicitly identified in
      notes.
