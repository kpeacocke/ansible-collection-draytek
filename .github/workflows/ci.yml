name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Ansible tooling
        run: python -m pip install -r requirements-dev.txt
      - name: ansible-lint
        run: ansible-lint
      - name: Build collection
        run: ansible-galaxy collection build --force
      - name: Discover installed modules and smoke-test without a device
        shell: bash
        run: |
          smoke_root="$RUNNER_TEMP/hostname-smoke"
          ansible-galaxy collection install kpeacocke-draytek-*.tar.gz \
            --no-deps -p "$smoke_root/collections"
          cd "$smoke_root"
          ANSIBLE_COLLECTIONS_PATH="$smoke_root/collections" \
            ansible-doc --json kpeacocke.draytek.drayos_command \
              kpeacocke.draytek.drayos_facts kpeacocke.draytek.drayos_hostname \
              kpeacocke.draytek.drayos_ntp \
              kpeacocke.draytek.drayos_tr069 \
              > plugin-docs.json
          python - <<'PY'
          import json
          with open("plugin-docs.json", encoding="utf-8") as stream:
              docs = json.load(stream)
          assert set(docs) == {
              "kpeacocke.draytek." + name
              for name in ("drayos_command", "drayos_facts", "drayos_hostname", "drayos_ntp", "drayos_tr069")
          }
          PY
          ANSIBLE_COLLECTIONS_PATH="$smoke_root/collections" \
            ansible-playbook "$smoke_root/collections/ansible_collections/kpeacocke/draytek/tests/integration/hostname.yml" -i localhost,
          ANSIBLE_COLLECTIONS_PATH="$smoke_root/collections" \
            ansible-playbook "$smoke_root/collections/ansible_collections/kpeacocke/draytek/tests/integration/ntp.yml" -i localhost,
          ANSIBLE_COLLECTIONS_PATH="$smoke_root/collections" \
            ansible-playbook "$smoke_root/collections/ansible_collections/kpeacocke/draytek/tests/integration/tr069.yml" -i localhost,

  units:
    # Uses plain pytest, not `ansible-test units --docker`: the only maintained
    # GitHub Action for ansible-test calls unpinned nested actions, which this
    # repository's SHA-pinning ruleset rejects (see PR #5 discussion).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            core: ">=2.19,<2.20"
            netcommon: "6.0.0"
          - python: "3.12"
            core: ">=2.20,<2.21"
            netcommon: "8.7.1"
          - python: "3.14"
            core: ">=2.21,<2.22"
            netcommon: "8.7.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Ansible tooling
        env:
          CORE_RANGE: ${{ matrix.core }}
        run: python -m pip install -r requirements-dev.txt "ansible-core$CORE_RANGE"
      - name: Install collection dependencies
        env:
          NETCOMMON_VERSION: ${{ matrix.netcommon }}
        run: ansible-galaxy collection install "ansible.netcommon:$NETCOMMON_VERSION" --force-with-deps
      - name: Run unit tests
        run: python -m pytest tests/unit

  sanity:
    # Scoped to plugins/ and tests/ (actual collection content). scripts/ and
    # .baseline/ are repository governance tooling, not collection content;
    # ansible-test treats the whole checkout as "the collection" and has no
    # config (galaxy.yml build_ignore only affects the build artifact) to
    # exclude them, so they are passed as explicit positional targets instead
    # of relying on a repo-wide scan (see PR #5 discussion).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/kpeacocke/draytek
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Ansible tooling
        run: python -m pip install -r ansible_collections/kpeacocke/draytek/requirements-dev.txt
      - name: Install collection dependencies
        working-directory: ansible_collections/kpeacocke/draytek
        run: ansible-galaxy collection install -r requirements.yml -p "$GITHUB_WORKSPACE"
      - name: Run ansible-test sanity
        working-directory: ansible_collections/kpeacocke/draytek
        run: ansible-test sanity --docker default -v -- plugins/ tests/
